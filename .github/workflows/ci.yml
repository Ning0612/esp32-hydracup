name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  firmware-build:
    name: PlatformIO firmware build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e esp32dev

      # OTA writes the image into the 1,310,720-byte app slot, so the firmware has to keep
      # fitting one. Failing here beats discovering it when a release will not install.
      - name: Check firmware fits the OTA app slot
        run: |
          size=$(stat -c%s .pio/build/esp32dev/firmware.bin)
          echo "firmware.bin = ${size} bytes ($((size * 100 / 1310720))% of the app slot)"
          if [ "$size" -gt 1205862 ]; then
            echo "::error::firmware.bin exceeds 92% of the 1,310,720-byte app slot"
            exit 1
          fi
          if [ "$size" -gt 1179648 ]; then
            echo "::warning::firmware.bin is over 90% of the app slot"
          fi

  native-tests:
    name: Native host-side tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Run native tests
        run: pio test -e native
