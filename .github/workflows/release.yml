name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release assets
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # version.txt is ESP-IDF's PROJECT_VER, so it ends up in the app descriptor that the
      # device checks after downloading; include/version.h is what the running firmware
      # reports. All three must agree or devices either never update, try to "update"
      # backwards, or reject the image they just downloaded.
      - name: Check versions agree with the tag
        run: |
          header=$(sed -n 's/^#define APP_VERSION  *"\(.*\)"/\1/p' include/version.h)
          manifest=$(tr -d ' \r\n' < version.txt)
          echo "tag=${{ steps.version.outputs.version }} version.h=${header} version.txt=${manifest}"
          if [ "$header" != "${{ steps.version.outputs.version }}" ] || [ "$manifest" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::version.h (${header}) and version.txt (${manifest}) must both equal ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Check release notes exist
        run: test -f "docs/releases/${GITHUB_REF_NAME}.md"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Run native tests
        run: pio test -e native

      - name: Build firmware
        run: pio run -e esp32dev

      - name: Build web filesystem image
        run: pio run -e esp32dev -t buildfs

      - name: Check firmware fits the OTA app slot
        run: |
          size=$(stat -c%s .pio/build/esp32dev/firmware.bin)
          echo "firmware.bin = ${size} bytes ($((size * 100 / 1310720))% of the app slot)"
          if [ "$size" -gt 1205862 ]; then
            echo "::error::firmware.bin exceeds 92% of the 1,310,720-byte app slot"
            exit 1
          fi

      # These names are baked into include/config.h on every deployed device. Renaming an
      # asset breaks updates for devices already in the field, so treat them as frozen.
      - name: Collect release assets
        run: |
          mkdir -p dist
          # The same file the firmware was built from, so the manifest and the image's app
          # descriptor cannot drift apart.
          cp version.txt dist/version.txt
          cp .pio/build/esp32dev/firmware.bin   dist/hydracup-esp32dev-firmware.bin
          cp .pio/build/esp32dev/littlefs.bin   dist/hydracup-esp32dev-littlefs.bin
          cp .pio/build/esp32dev/bootloader.bin dist/hydracup-esp32dev-bootloader.bin
          cp .pio/build/esp32dev/partitions.bin dist/hydracup-esp32dev-partitions.bin
          cd dist && sha256sum version.txt hydracup-esp32dev-*.bin > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          files: dist/*
